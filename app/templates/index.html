{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <img src="{% static 'images/atlas_logo_negative.png' %}" alt="Logo Atlas" class="logo">
            </div>

            <ul class="list-unstyled components">
                <li class="active"><a href="#"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-chart-line"></i> Negócios</a></li>
                <li><a href="#"><i class="fas fa-wallet"></i> Financeiro</a></li>
                <li><a href="#"><i class="fas fa-box"></i> Produtos</a></li>
            </ul>

            <div class="user-footer">
                <p>Olá, <strong>{{ nome }}</strong></p>
                <a href="{% url 'logout' %}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sair</a>
            </div>
        </nav>

        <div id="content">
            <header class="main-header">
                <h2>Visão Geral</h2>
            </header>

            <div class="dashboard-cards">
    <div class="card receita">
        <div class="card-icon"><i class="fas fa-arrow-up"></i></div>
        <div>
            <span class="label">Receitas</span>
            <h3 class="value">R$ 0,00</h3>
        </div>
    </div>

    <div class="card despesa">
        <div class="card-icon"><i class="fas fa-arrow-down"></i></div>
        <div>
            <span class="label">Despesas</span>
            <h3 class="value">R$ 0,00</h3>
        </div>
    </div>
</div>
        </div>
        <div class="dashboard-content">
    <div class="charts-container">
        <div class="chart-card">
            <h3>Fluxo de Caixa (Receitas vs Despesas)</h3>
            <canvas id="meuGraficoFinanceiro"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </div>
</body>
</html>
