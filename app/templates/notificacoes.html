{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="card shadow">
        <h3>Configurações de Avisos</h3>
        <p class="text-muted">Marque quais alertas você deseja receber no seu painel.</p>
        <form>
            <label style="display: block; margin-bottom: 10px;">
                <input type="checkbox" checked> Notificar-me quando o estoque de um produto estiver esgotando.
            </label>
            <label style="display: block; margin-bottom: 15px;">
                <input type="checkbox" checked> Enviar resumo de fechamento financeiro por e-mail.
            </label>
            <button type="button" class="btn-primary">Salvar Preferências</button>
        </form>
    </div>
</div>
{% endblock %}
